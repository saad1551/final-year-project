name: fyp-venv
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.10

  # Core deep learning (install from conda for better compatibility)
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - torchaudio>=2.0.0
  - pytorch-cuda=12.1  # Change to your CUDA version (11.8, 12.1, etc.)
  
  # Scientific computing
  - numpy>=1.24.0
  - pandas>=1.5.0
  - scipy>=1.10.0
  
  # Existing dependencies
  - jupyter
  - pillow
  - lxml
  
  # Development tools (optional)
  - ipython
  - pytest
  
  # Pip packages (installed via pip within conda env)
  - pip
  - pip:
      # Transformers ecosystem
      - transformers>=4.35.0
      - accelerate>=0.24.0
      - peft>=0.7.0
      - bitsandbytes>=0.41.0
      - sentencepiece>=0.1.99
      - protobuf>=3.20.0
      
      # Reinforcement Learning
      - stable-baselines3>=2.0.0
      - gymnasium>=0.28.0
      
      # Data processing
      - datasets>=2.14.0
      - tqdm>=4.65.0
      
      # Web interaction (existing)
      - playwright>=1.40.0
      - lxml_html_clean
      - requests>=2.31.0
      - beautifulsoup4>=4.12.0
      
      # LLM API clients
      - openai>=1.0.0
      - anthropic>=0.7.0
      
      # Utilities
      - colorama>=0.4.6
      - python-dotenv>=1.0.0

prefix: /Users/saadashraf/miniconda3/envs/fyp-venv

# ============================================================================
# Installation/Update Instructions:
#
# 1. Update your existing environment:
#    conda env update -f environment.yml --prune
#
# 2. Activate the environment:
#    conda activate fyp-venv
#
# 3. Install playwright browsers (one-time setup if not done):
#    playwright install
#
# 4. Verify installation:
#    python -c "import torch; print(f'PyTorch: {torch.__version__}'); print(f'CUDA: {torch.cuda.is_available()}')"
#    python -c "import transformers, peft, stable_baselines3; print('✓ All imports successful!')"
#
# ============================================================================
# Notes:
# - If you don't have a GPU or CUDA, remove the pytorch-cuda=12.1 line
# - Check your CUDA version with: nvidia-smi
# - Common CUDA versions: 11.8, 12.1
# ============================================================================
