name: insta
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # Core deep learning (install from conda for better compatibility)
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - torchaudio>=2.0.0
  # If you have CUDA, set the appropriate cudatoolkit/pytorch-cuda package (example below)
  - pytorch-cuda=12.1

  # System / scientific packages
  - numpy>=1.24.0
  - pandas>=1.5.0
  - scipy>=1.10.0
  - ffmpeg
  - datasets

  # Utilities and tooling
  - jupyter
  - ipykernel
  - ipython
  - pillow
  - lxml
  - scikit-learn
  - setuptools
  - pip

  # Dev/test
  - pytest

  # Install remaining Python packages via pip to preserve versions not available on conda
  - pip:
      # Transformers ecosystem
      - transformers>=4.35.0
      - accelerate>=0.24.0
      - peft>=0.7.0
      - bitsandbytes>=0.41.0
      - sentencepiece>=0.1.99
      - protobuf>=3.20.0
      - huggingface-hub>=0.16.4

      # Reinforcement Learning
      - stable-baselines3>=2.0.0
      - gymnasium>=0.28.0

      # Data processing / tabulation
      - datasets>=2.14.0
      - tabulate>=0.9.0

      # Web interaction and HTML cleaning
      - playwright>=1.40.0
      - requests>=2.31.0
      - beautifulsoup4>=4.12.0
      - lxml-html-clean>=0.1.0

      # Video and multimedia
      - scikit-video>=1.1.10

      # LLM tooling
      - openai>=1.0.0
      - anthropic>=0.7.0
      - vllm>=0.4.0

      # Additional utilities
      - tqdm>=4.65.0
      - colorama>=0.4.6
      - python-dotenv>=1.0.0
      - gradio-client>=0.3.0

      # Dev & formatting
      - black>=23.0.0
      - flake8>=6.0.0

      # Optional: other recommended tools
      - ipython>=8.12.0
      - jupyter>=1.0.0


# Notes:
# - Create the environment with: conda env create -f environment.yml
# - To update an existing env: conda env update -f environment.yml --prune
# - If you prefer a different CUDA version, change/remove 'pytorch-cuda=12.1'
# - After creating the environment, activate it and install Playwright browsers:
#     conda activate fyp-venv
#     playwright install
